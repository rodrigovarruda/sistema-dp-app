<title>Sistema DP Conarte</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra de contexto (empresa · competência · perfil) + abas de trabalho; planilha larga em contêiner rolável com nome fixo */
:root{
  --bg:#eef1f0; --surface:#ffffff; --surface-2:#f6f8f7; --ink:#17252f; --muted:#5b6a72; --line:#d5dcde;
  --brand:#1f4d63; --brand-ink:#ffffff; --accent:#b8740b; --accent-soft:#fbefd9;
  --ok:#1f7a4c; --ok-bg:#dff2e7; --half:#4f8a2a; --half-bg:#ecf5df;
  --bad:#b3261e; --bad-bg:#fbe1de; --warn:#94600a; --warn-bg:#fcefd2; --su:#7a3300; --su-bg:#ffb366; --pe:#5b2a9e; --pe-bg:#e9dcfb; --fe:#ffffff; --fe-bg:#2563c9;
  --rest:#4d6070; --rest-bg:#e6ebef; --av:#0d6f73; --av-bg:#d9f0ef; --ft:#6b3fa0; --ft-bg:#ece3f7;
  --weekend:#f0f2f3; --focus:#2f7fb0;
  --conarte:#b4530a; --conarte-bg:#fde6d2; --engevac:#1d5fa8; --engevac-bg:#dce8f8; --cieng:#4f5b66; --cieng-bg:#e3e7eb;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1518; --surface:#162126; --surface-2:#1b282e; --ink:#e2e9ec; --muted:#95a5ad; --line:#2a3a41;
  --brand:#5ea6c7; --brand-ink:#0b1417; --accent:#e3a43c; --accent-soft:#3a2c12;
  --ok:#6fd39c; --ok-bg:#163a28; --half:#a6d77a; --half-bg:#24361a;
  --bad:#ff8a80; --bad-bg:#45201d; --warn:#f0c060; --warn-bg:#3d2f12; --su:#ffb36b; --su-bg:#6b3608; --pe:#c9a8ff; --pe-bg:#33204f; --fe:#ffffff; --fe-bg:#3b78dc;
  --rest:#a9b9c6; --rest-bg:#24313a; --av:#6fd6d2; --av-bg:#123a3a; --ft:#c7a5f0; --ft-bg:#2f2442;
  --weekend:#121c20; --focus:#7cc3e6; color-scheme:dark;
  --conarte:#f5a35c; --conarte-bg:#3d2614; --engevac:#86b9f0; --engevac-bg:#14283f; --cieng:#b9c3cc; --cieng-bg:#2b3238}}
:root[data-theme="dark"]{
  --bg:#0e1518; --surface:#162126; --surface-2:#1b282e; --ink:#e2e9ec; --muted:#95a5ad; --line:#2a3a41;
  --brand:#5ea6c7; --brand-ink:#0b1417; --accent:#e3a43c; --accent-soft:#3a2c12;
  --ok:#6fd39c; --ok-bg:#163a28; --half:#a6d77a; --half-bg:#24361a;
  --bad:#ff8a80; --bad-bg:#45201d; --warn:#f0c060; --warn-bg:#3d2f12; --su:#ffb36b; --su-bg:#6b3608; --pe:#c9a8ff; --pe-bg:#33204f; --fe:#ffffff; --fe-bg:#3b78dc;
  --rest:#a9b9c6; --rest-bg:#24313a; --av:#6fd6d2; --av-bg:#123a3a; --ft:#c7a5f0; --ft-bg:#2f2442;
  --weekend:#121c20; --focus:#7cc3e6; color-scheme:dark;
  --conarte:#f5a35c; --conarte-bg:#3d2614; --engevac:#86b9f0; --engevac-bg:#14283f; --cieng:#b9c3cc; --cieng-bg:#2b3238}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;text-transform:uppercase}
input,select,textarea,button,::placeholder{text-transform:uppercase}
.wrap{max-width:1280px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.demo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.demo b{font-weight:700}
.demo .btn{padding:5px 12px}

header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;font-weight:700;color:var(--brand)}
.brand span{color:var(--muted);font-size:13px}
.ctx{display:flex;flex-wrap:wrap;gap:10px}
.field{display:flex;flex-direction:column;gap:3px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-height:36px}
textarea{resize:vertical;min-height:60px;width:100%}

.status-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.extra-it{padding:2px 0;font-family:var(--f-body)}
.conta-cel{display:inline-flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.conta-soma{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.conta-outra{display:block;text-align:right;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.rel-dia{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rel-dia select{min-width:120px}
.st-painel{flex-basis:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.st-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.st-lista{max-height:320px;overflow-y:auto}
.st-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.st-linha:last-child{border-bottom:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:13px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.chip.st{background:var(--brand);color:var(--brand-ink);border-color:transparent}

nav.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs button{background:none;border:0;padding:10px 16px;font-family:var(--f-display);font-size:18px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel-head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel-head h2{font-size:21px}
.hint{color:var(--muted);font-size:13px}

/* Planilha */
.scroller{overflow-x:auto}
/* planilha com rolagem própria do tamanho da tela: o cabeçalho dos dias e a coluna dos nomes ficam sempre à vista */
.plan-scroll{overflow:auto;max-height:calc(100vh - 16px)}
table.grid{border-collapse:separate;border-spacing:0;font-size:12px}
table.grid th,table.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
table.grid thead th{position:sticky;top:0;z-index:4;background:var(--surface-2);font-weight:600;padding:4px 0;min-width:80px}
table.grid thead th .wd{display:block;font-size:10px;color:var(--muted);font-weight:500}
table.grid .name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:6px 10px;min-width:190px;max-width:190px}
table.grid thead .name{z-index:5;background:var(--surface-2)}
/* mês inteiro na tela: colunas estreitas com a sigla da obra */
table.grid.compacta{width:100%;min-width:1000px;table-layout:fixed}
table.grid.compacta thead th{min-width:0;font-size:11px}
table.grid.compacta thead th .wd{font-size:9px}
table.grid.compacta .name{width:170px;min-width:170px;max-width:170px;padding:5px 8px}
table.grid.compacta th:last-child,table.grid.compacta td.tot{width:48px}
table.grid.compacta .cell{width:100%;padding:0 1px !important;font-size:10px;text-overflow:clip;letter-spacing:-.02em}
.name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name small{color:var(--muted);font-size:11px}
th.we,td.we{background:var(--weekend)}
.cell{width:80px;height:34px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 5px !important;border:0;background:transparent;cursor:pointer;font-family:var(--f-data);font-weight:600;font-size:11px;position:relative;padding:0}
.cell:disabled{cursor:not-allowed;opacity:.45}
.cell.pend{outline:2px dashed var(--bad);outline-offset:-5px;color:var(--bad)}
.cell .dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.c-P{background:var(--ok-bg);color:var(--ok)} .c-M{background:var(--half-bg);color:var(--half)}
.c-F{background:var(--bad-bg);color:var(--bad)} .c-FJ,.c-AT{background:var(--warn-bg);color:var(--warn)}
.c-SU{background:var(--su-bg);color:var(--su)} .c-PE{background:var(--pe-bg);color:var(--pe)} .c-FE{background:var(--fe-bg);color:var(--fe)}
.c-FO,.c-D,.c-X{background:var(--rest-bg);color:var(--rest)} .c-AV{background:var(--av-bg);color:var(--av)} .c-FT{background:var(--ft-bg);color:var(--ft)}
td.tot{padding:0 8px;font-family:var(--f-data);font-weight:600;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{font-style:normal;font-family:var(--f-data);font-weight:600;border-radius:4px;padding:1px 5px}

/* Calendário */
.cal-wrap{padding:14px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;font-weight:600}
.day{border:1px solid var(--line);border-radius:8px;min-height:78px;padding:6px 7px;text-align:left;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.we{background:var(--weekend)}
.day:disabled{cursor:not-allowed;opacity:.5}
.day .n{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.day .code{align-self:flex-start;font-family:var(--f-data);font-weight:600;font-size:12px;border-radius:4px;padding:1px 6px}
.day .ob{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.pend{border:2px dashed var(--bad)}
.day .ob.unl{color:var(--accent);font-weight:600}
.day .code{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unl-chip{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.c-P,.cell.c-M{font-family:var(--f-body);font-size:11px}
.cell.has-obs::after{content:'';position:absolute;left:4px;bottom:3px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.6}
.legend i.c-P,.legend i.c-M{font-family:var(--f-body)}
.cal-side{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:16px}
.facts{display:flex;flex-direction:column;gap:8px;font-size:13px}
.facts div{display:flex;justify-content:space-between;gap:8px;min-width:0;border-bottom:1px solid var(--line);padding-bottom:6px}
.facts dt{color:var(--muted)}

/* Benefícios */
table.ben{width:100%;border-collapse:collapse;font-size:13px}
table.ben th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
table.ben th:first-child,table.ben td:first-child{text-align:left}
table.ben td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums;white-space:nowrap}
table.ben td:first-child{font-family:var(--f-body)}
table.ben tr.row{cursor:pointer}
table.ben tr.row:hover td{background:var(--surface-2)}
table.ben tfoot td{font-weight:700;border-top:2px solid var(--line)}
.memo{background:var(--surface-2);padding:14px 16px !important;text-align:left !important;white-space:normal !important;font-family:var(--f-body) !important}
.memo-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.memo-card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.memo-card h3{font-size:16px;margin-bottom:4px}
.memo-card .f{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.memo-card .v{font-family:var(--f-data);font-weight:600;margin-top:4px}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--accent-soft);color:var(--warn);font-family:var(--f-body)}

/* Fechamento */
.steps{display:flex;flex-wrap:wrap;gap:0;padding:16px 14px}
.step{flex:1 1 140px;display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-top:4px solid var(--line);color:var(--muted)}
.step.done{border-top-color:var(--ok);color:var(--ink)}
.step.now{border-top-color:var(--accent);color:var(--ink)}
.step b{font-family:var(--f-display);font-size:18px}
.close-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:0 14px 16px}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px}
.check .ic.ok{background:var(--ok-bg);color:var(--ok)} .check .ic.bad{background:var(--bad-bg);color:var(--bad)} .check .ic.warn{background:var(--warn-bg);color:var(--warn)}
.check p{margin:2px 0 0;color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.link-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.link-row code{font-family:var(--f-data);background:var(--accent-soft);color:var(--warn);padding:2px 6px;border-radius:4px}
.audit{max-height:340px;overflow:auto;font-size:13px}
.audit li{padding:8px 0;border-bottom:1px solid var(--line);list-style:none}
.audit ul{margin:0;padding:0}
.audit .when{font-family:var(--f-data);font-size:11px;color:var(--muted)}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}
h3.sub{font-size:18px;margin:14px 0 4px}

/* Editor */
.overlay{position:fixed;inset:0;background:rgba(10,20,25,.45);display:grid;place-items:center;z-index:50;padding:16px}
.editor{background:var(--surface);border-radius:12px;width:min(520px,100%);max-height:calc(100% - 20px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.editor h2{font-size:22px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.codes button{border:2px solid transparent;border-radius:6px;padding:6px;cursor:pointer;text-align:left;font-size:12px;line-height:1.2}
.codes button b{display:block;font-family:var(--f-data);font-size:13px}
.codes button[aria-pressed=true]{border-color:var(--ink)}
.codes .none{background:var(--surface-2);color:var(--muted)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.timeline{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:10px}
.timeline li{position:relative;display:flex;flex-direction:column;gap:1px;font-size:13px}
.timeline li::before{content:'';position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand)}
.timeline li:first-child::before{background:var(--accent)}
.timeline .num{font-size:12px;color:var(--muted)}
.editor.recibos{width:min(880px,100%);background:var(--bg)}
.rec-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.recibo{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.recibo header{display:flex;gap:12px;align-items:center;border-bottom:2px solid var(--ink);padding-bottom:10px}
.recibo .logo{width:44px;height:44px;border-radius:6px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.recibo .rec-num{margin-left:auto;text-align:right;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.recibo .rec-num b{font-size:18px}
.recibo h3{font-size:20px;text-transform:uppercase;letter-spacing:.04em;text-align:center}
.recibo p{margin:0;line-height:1.6;max-width:72ch}
.rec-tab{border-collapse:collapse;width:min(360px,100%);font-size:13px}
.rec-tab td{border-bottom:1px solid var(--line);padding:4px 6px}.rec-tab td:last-child{text-align:right;font-family:var(--f-data)}
.rec-dados{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin:0;font-size:13px}
.rec-dados dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.rec-dados dd{margin:0;font-weight:600}
.assin{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-top:22px}
.assin .linha{border-top:1px solid var(--ink);padding-top:4px;min-width:min(260px,100%);text-align:center}
.recibo footer{border-top:1px dashed var(--line);padding-top:6px;font-size:11px}
.ficha-top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:6px}
.quinz{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.quinz-head{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.obra-pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.obra-pick .hint{flex-basis:100%}
.pick{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.pick.on{background:var(--ok-bg);color:var(--ok);border-color:var(--ok);font-weight:600}
.sugg{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60}

/* Funcionários e acordo */
.cad{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;padding:14px}
.cad-list{display:flex;flex-direction:column;gap:6px;position:sticky;top:8px;align-self:start;max-height:calc(100vh - 16px)}
.cad-itens{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;flex:1;padding-right:2px}
.cad-busca{width:100%}
.lemb-lista{display:flex;flex-direction:column;gap:6px}
.lemb{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface)}
.lemb.perto{background:var(--warn-bg);border-color:transparent}
.lemb-form{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
button.chip{cursor:pointer}
.cad-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer}
.cad-item[aria-current=true]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand);background:var(--surface-2)}
.cad-main{min-width:0}

const soDig=v=>String(v||'').replace(/\D/g,'');

  for(const k of ['ajuda','cafe'])if(A.ben[k]!=null&&!(k==='ajuda'&&A.ajudaFixa)){const bruto=A.ben[k]/DU_SET*diasSet;r.itens[k]={bruto,valor:floor10(bruto),ref:PROX_NOME,f:`${brl(A.ben[k])} ÷ ${DU_SET} dias úteis de ${PROX_NOME} × (${DU_SET} − ${nfmt(faltas)} faltas de ${MES_CURTO}) dias`}}
  if(A.ben.alim!=null){const bruto=A.ben.alim/DU_SET*diasSet;r.itens.alim={bruto,valor:floor10(bruto),ref:PROX_NOME,f:`${brl(A.ben.alim)} ÷ ${DU_SET} dias úteis de ${PROX_NOME} × (${DU_SET} − ${nfmt(faltas)} faltas de ${MES_CURTO}) dias`}}
  if(A.tarifa!=null){const bruto=2*A.tarifa*diasSet,natal=A.pg?.tarifa==='natal';r.itens.transp={bruto,valor:arredTransp(bruto,natal),natal,ref:PROX_NOME,f:`2 × tarifa ${brl(A.tarifa)} × ${nfmt(diasSet)} dias`}}
  r.acordo=A;
  const avDias=Object.entries(p).reduce((a,[d,x])=>a+(CODES[x.c].trab&&vincDia(f,+d)==='avulso'?CODES[x.c].peso:0),0);
  if(temAvulso(f)&&avDias>0){const per=f.vh.length>1?` · período como avulso: ${f.vh.filter(x=>x.vinc==='avulso').map(x=>{const i=f.vh.indexOf(x),fim=f.vh[i+1]?f.vh[i+1].de-1:NDIAS;return dd(x.de)+' a '+dd(fim)}).join(', ')}`:'';
    r.itens.diarias={bruto:f.diaria*avDias,valor:f.diaria*avDias,f:`${nfmt(avDias)} dia(s) de serviço avulso no ponto × ${brl(f.diaria)} (${f.funcao})${per}`}}
  r.avDias=avDias;
  // saída neste mês: o último fechamento não paga os benefícios do mês seguinte (só a bonificação do mês trabalhado)
  if(saidaDia(f)){const tira=['ajuda','cafe','alim','transp'].filter(k=>r.itens[k]);tira.forEach(k=>delete r.itens[k]);
    if(tira.length)r.nota=(r.nota?r.nota+' ':'')+`${saidaTxt(f)}: ajuda de custo, café, alimentação e passagens de ${PROX_NOME} não são pagos.`}
  // funcionário já fechado: valem os valores gravados no fechamento (o que foi pago), mesmo que a regra de cálculo mude depois
  const fg=S.fechF[f.id]?.itens;
  if(fg)for(const k in r.itens)if(k in fg&&Math.abs(fg[k]-r.itens[k].valor)>.004){r.itens[k].valor=fg[k];r.itens[k].natal=false;r.itens[k].gravado=true}
  if(f.vh.length>1&&f.vinc==='mensalista'){const a=calcAdiant(f);r.nota=`Mensalista desde ${dd(f.vh.find(x=>x.vinc==='mensalista').de)}: benefícios contam só os dias a partir do registro. Dias como avulso foram pagos por diária.`+(a?` O Adiantamento auxílio-transporte (${brl(a.total)}: ${a.lista} de ${dd(a.de)} a ${dd(NDIAS)}) já foi pago em recibo próprio. Aqui entram a bonificação de ${MES_CURTO} e ajuda de custo, café, alimentação e passagens de ${PROX_NOME}.`:'')}
  r.total=Object.values(r.itens).reduce((a,b)=>a+b.valor,0);
  // rateio por obra: dias trabalhados por obra
  const porObra={};let tot=0;
  for(const d in p){const x=p[d];if(!CODES[x.c].trab)continue;const k=resolve(x.o)||('?'+x.o);porObra[k]=(porObra[k]||0)+CODES[x.c].peso;tot+=CODES[x.c].peso}
  r.rateio=Object.entries(porObra).map(([k,n])=>({obra:k[0]==='?'?k.slice(1):OBRAS[k].nome,vinc:k[0]!=='?',dias:n,frac:tot?n/tot:0}));
  return r;
}

const AFAST=[['F','Falta'],['FE','Férias'],['PE','Perícia (INSS)'],['AT','Atestado médico'],['SU','Suspensão']];
// dia de referência: o escolhido no seletor da aba; sem escolha, hoje no mês atual, último dia num mês passado, dia 1 num mês futuro
const diaHoje=()=>{const h=new Date(),c=h.getFullYear()*12+h.getMonth(),k=ANO*12+MES;return k<c?NDIAS:k>c?1:h.getDate()};
const diaRef=()=>S.relDiaComp===COMP&&S.relDia>=1&&S.relDia<=NDIAS?S.relDia:diaHoje();
const refTxt=()=>{const h=new Date(),d=diaRef(),hoje=h.getFullYear()===ANO&&h.getMonth()===MES&&h.getDate()===d;return hoje?`hoje (${dd(d)})`:`em ${dd(d)}/${ANO} (${WD_LONG[dow(d)]})`};
// período do afastamento em volta do dia: o programado, se houver; senão os dias seguidos com o mesmo código no ponto
function periodoAfast(f,c,d){
  const dt=new Date(ANO,MES,d),a=(f.agenda||[]).find(x=>x.c===c&&lerData(x.de)<=dt&&lerData(x.ate)>=dt);if(a)return `${a.de} a ${a.ate}`;
  const p=S.ponto[f.id]||{};let i=d,j=d;while(i>1&&p[i-1]?.c===c)i--;while(j<NDIAS&&p[j+1]?.c===c)j++;
  return `${dd(i)} a ${dd(j)}${j===NDIAS?' (ou mais)':''}`;

function dadosRelatorios(){

  const avulsos=base.filter(temAvulso).sort((a,b)=>empresaDe(a).localeCompare(empresaDe(b))||a.nome.localeCompare(b.nome));

function cadastrarDemitido(x,comp){

// Importa os salários pagos (1ª quinzena = adiantamento, 2ª = líquido) do arquivo gerado a partir do PDF da folha; casa pelo CPF
function importarSalarios(d){
  if(d?.tipo!=='sistemaDP.salarios'||!Array.isArray(d.itens))throw new Error('o arquivo não é de salários da folha');
  if(d.comp!==COMP)return toast(`Esta folha é de ${compLabel(d.comp)}. Troque a competência no topo para ${compLabel(d.comp)} e importe de novo.`);
  const porCpf=new Map(ALL.filter(f=>soDig(f.cpf)).map(f=>[soDig(f.cpf),f]));
  const ok=[],fora=[],demit=[];let ja=0;
  for(const x of d.itens){const f=porCpf.get(soDig(x.cpf));
    // demitido no mês, não cadastrado, que recebeu algo: será cadastrado como desligado para aparecer nos salários e no custo do mês
    if(!f){if(x.situacao==='Demitido'&&lerData(x.demissao)&&(+x.q1||0)+(+x.q2||0)>0&&FUNC[x.empresa])demit.push(x);else fora.push(x.nome);continue}
    const fo=S.folha?.[f.id];if(fo&&((+fo.q1||0)||(+fo.q2||0)))ja++;ok.push({f,x})}
  if(!ok.length&&!demit.length)return toast('Nenhum CPF do arquivo foi encontrado entre os funcionários cadastrados.');
  if(!confirm(`Importar os salários de ${compLabel(d.comp)} de ${ok.length+demit.length} funcionário(s)?${ja?`\n\n${ja} já tinham valores digitados, que serão substituídos pelos da folha.`:''}${demit.length?`\n\n${demit.length} demitido(s) no mês não estão cadastrados: serão cadastrados como desligados na data da demissão (aparecem só neste mês): ${demit.map(x=>x.nome).join(', ')}.`:''}${fora.length?`\n\n${fora.length} da folha não estão cadastrados e ficam de fora.`:''}`))return;
  for(const x of demit)ok.push({f:cadastrarDemitido(x,d.comp),x});
  S.folha=S.folha||{};
  // a 2ª quinzena já vem com a pensão alimentícia somada (a empresa paga ao beneficiário); guarda o valor para mostrar
  // e a 1ª quinzena já vem sem a parcela do empréstimo descontada no adiantamento (guarda o valor para mostrar)
  for(const {f,x} of ok)S.folha[f.id]={...(S.folha[f.id]||{}),q1:+x.q1||0,q2:+x.q2||0,pensao:+x.pensao||0,emprestimo:+x.emprestimo||0};
  const t=k=>Math.round(ok.reduce((s,y)=>s+(+y.x[k]||0),0)*100)/100;
  registrar(`Salários · ${MES_NOME}`,'—',`Importados da folha: ${ok.length} funcionário(s) · 1ª quinzena ${brl(t('q1'))} · 2ª quinzena ${brl(t('q2'))}`,'Importação da folha da contabilidade');
  S.salImpRes={comp:d.comp,n:ok.length,q1:t('q1'),q2:t('q2'),fora};render();
  toast(`Salários de ${ok.length} funcionário(s) importados. O custo por obra já usa os valores reais.`);
}

const FORMAS_PAG=[['esp','Espécie'],['alim','Alelo Alimentação'],['livre','Alelo Saldo Livre'],['natal','NatalCard'],['cesta','Cesta básica']];
function pagamentosDe(f){
  const fe=S.fechF[f.id],a=calcAdiant(f),r={adi:0,dia:0,auxEsp:0,alim:0,livre:0,natal:0,cesta:0};
  if(a&&a.total>0&&f.adiantQuando&&f.vinc==='mensalista')r.adi=a.total;
  for(const q of [1,2])r.dia+=+(S.qf[q]?.[f.id]?.valor)||0;
  if(fe){r.alim=+fe.alelo?.alim||0;r.livre=+fe.alelo?.livre||0;r.natal=+fe.alelo?.natal||0;
    r.auxEsp=Math.max(0,fe.especie!=null?+fe.especie:(+fe.aux||0)-aleloSoma(fe.alelo));
    if(fe.cesta)r.cesta+=fe.cestaValor!=null?+fe.cestaValor:valorCesta(f)}
  if(temCestaReg(f))r.cesta+=valorCesta(f);
  const c=v=>Math.round(v*100)/100;r.esp=c(r.adi+r.dia+r.auxEsp);r.total=c(r.esp+r.alim+r.livre+r.natal+r.cesta);return r;
}

function custoFunc(f,guia=0){
  const E=EMPRESAS[empresaDe(f)]||{},A=acordo(f),c=calc(f),p=S.ponto[f.id];
  const r={};let totM=0;
  for(const d in p){const x=p[d];if(!CODES[x.c]?.trab)continue;const k=resolve(x.o)||('?'+x.o);r[k]=r[k]||{m:0,a:0};
    if(vincDia(f,+d)==='avulso')r[k].a+=CODES[x.c].peso;else{r[k].m+=CODES[x.c].peso;totM+=CODES[x.c].peso}}
  const it={sal1:0,sal2:0,insal:0,peric:0,bonif:0,ajuda:0,cafe:0,alim:0,transp:0,cesta:0,guias:0};let est=false,estSal=false,fatorIns=0;
  const m=f.vh.find(x=>x.vinc==='mensalista');
  if(m){
    const ini=Math.max(m.de,admDia(f));
    const fo=S.folha?.[f.id],pago=fo?(+fo.q1||0)+(+fo.q2||0):0;
    if(pago>0){it.sal1=+fo.q1||0;it.sal2=+fo.q2||0}
    else if(A.salario&&ini<=NDIAS){estSal=true;const nF=Object.entries(p).filter(([d,x])=>+d>=ini&&(x.c==='F'||x.c==='SU')).length;
      // estimativa sem folha: metade em cada quinzena
      const fimV=saidaDia(f)||NDIAS,diasVinc=ini<=1&&fimV===NDIAS?30:Math.min(30,fimV-ini+1),est2=A.salario/30*Math.max(0,diasVinc-nF)*(1+(+E.encargos||0)/100);it.sal1=it.sal2=est2/2;
      // a insalubridade segue a mesma proporção do salário estimado (com o salário informado, ela já vem dentro dele)
      fatorIns=Math.max(0,diasVinc-nF)/30*(1+(+E.encargos||0)/100);
      // periculosidade: % do próprio salário, na mesma proporção, rateada pelas obras como o salário
      if(A.peric)it.peric=A.salario*A.peric/100*fatorIns}
    if(c.itens.bonif)it.bonif=c.itens.bonif.valor;
    // verbas referentes a este mês: adiantamento/cesta do registro, ou fechamento do mês anterior
    if(diaEntrada(f)){const a=calcAdiant(f);if(a&&f.adiantQuando)for(const x of a.itens)it[x.k]+=x.valor;if(temCestaReg(f))it.cesta+=valorCesta(f)}
    else{const pv=S.comps?.[prevKey()]?.fechF?.[f.id];
      if(pv&&pv.itens){for(const k of ['ajuda','cafe','alim','transp'])it[k]+=pv.itens[k]||0;if(pv.cesta)it.cesta+=pv.cestaValor!=null?pv.cestaValor:valorCesta(f)}
      else{est=true;for(const k of ['ajuda','cafe','alim'])it[k]+=A.ben[k]||0;if(A.tarifa)it.transp+=arredTransp(2*A.tarifa*DU_AGO,A.pg?.tarifa==='natal');if(A.cesta)it.cesta+=valorCesta(f)}}
  }
  it.guias=guia;
  const dia=f.diaria||DIARIAS[f.funcao]||0,out={};
  for(const [k,v] of Object.entries(r)){out[k]={dias:v.m+v.a,diarias:v.a*dia};for(const x in it)out[k][x]=totM?it[x]*v.m/totM:0;

  return {out,est,estSal,sal:it.sal1+it.sal2};
}

function faixasDias(ds){
  const s=[...ds].sort((a,b)=>a-b),out=[];let i=0;
  while(i<s.length){let j=i;while(j+1<s.length){let d=s[j]+1;while(d<s[j+1]&&!obrig(d))d++;if(d===s[j+1])j++;else break}
    out.push(i===j?dd(s[i]):`${dd(s[i])} a ${dd(s[j])}`);i=j+1}
  return out.join(', ');
}

function relatorioFaltas(de,ate,escolha,tipoRel){
  const [nomeT,cods]=REL_TIPOS[tipoRel]||REL_TIPOS.fsu;
  const {tipo,val,fs,titulo}=filtroRel(escolha,true),reg={},semDados=new Set();
  for(const d=new Date(de);d<=ate;d.setDate(d.getDate()+1)){
    const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),p=pontoComp(k);
    if(!p){semDados.add(MESES_LONGO[d.getMonth()]+'/'+d.getFullYear());continue}
    for(const f of fs){const r=p[f.id]?.[d.getDate()];if(r&&cods.includes(r.c))(reg[f.id]=reg[f.id]||[]).push({data:fmtData(d).slice(0,5),c:r.c,obs:r.obs&&r.obs!==CODES[r.c].l?r.obs:''})}
  }
  const conta=(x,c)=>x.filter(i=>i.c===c).length;
  const linhas=fs.filter(f=>reg[f.id]).map(f=>({f,its:reg[f.id],n:Object.fromEntries(cods.map(c=>[c,conta(reg[f.id],c)]))}))
    .sort((a,b)=>{for(const c of cods)if(b.n[c]!==a.n[c])return b.n[c]-a.n[c];return a.f.nome.localeCompare(b.f.nome)});
  const E=EMPRESAS[tipo==='emp'?val:tipo==='obra'?OBRAS[val]?.empresa:'CONARTE']||{};
  // dias seguidos com o mesmo código viram faixa (ex.: 03/11 a 07/11 (PE))
  const dias=x=>{const out=[];for(const i of x.its){const u=out[out.length-1];if(u&&u.c===i.c&&!i.obs&&!u.obs&&u.fimN+1===+i.data.slice(0,2)&&u.mes===i.data.slice(3)){u.fim=i.data;u.fimN++}else out.push({...i,fim:null,fimN:+i.data.slice(0,2),mes:i.data.slice(3)})}
    return out.map(i=>`${i.data}${i.fim?' a '+i.fim:''}${cods.length>1&&i.c!=='F'?` (${i.c})`:''}${i.obs&&i.obs!==CODES[i.c]?.l?` <span class="sub">${esc(i.obs)}</span>`:''}`).join(', ')};
  const corpo=linhas.map(x=>`<tr><td><b>${esc(x.f.nome)}</b><br><span class="sub">${esc(x.f.funcao)} · ${empresaDe(x.f)} · ${esc(OBRAS[lotacao(x.f,NDIAS)]?.nome||'—')}</span></td>${cods.map(c=>`<td>${x.n[c]}</td>`).join('')}<td style="text-align:left;white-space:normal">${dias(x)}</td></tr>`).join('');
  const periodo=`${fmtData(de)} a ${fmtData(ate)}`;
  const nomeR=cods.length===1?REL_COL[cods[0]].replace(/ \(.*/,'').toLowerCase():{afast:'faltas e afastamentos',todos:'faltas, afastamentos e férias'}[tipoRel]||nomeT.toLowerCase();
  janelaRelatorio({titulo:`Relatório de ${nomeR} · ${titulo}`,meta:`Período ${periodo} · ${linhas.length} funcionário(s)`,logo:E.logo,
    tabela:`<table><thead><tr><th>Funcionário</th>${cods.map(c=>`<th>${REL_COL[c]}</th>`).join('')}<th style="text-align:left">Dias</th></tr></thead><tbody>${corpo||`<tr><td colspan="${cods.length+2}">Nada no período.</td></tr>`}</tbody>
      <tfoot><tr><td>Total</td>${cods.map(c=>`<td>${linhas.reduce((s,x)=>s+x.n[c],0)}</td>`).join('')}<td></td></tr></tfoot></table>`,
    nota:`Contados os dias marcados no ponto: ${cods.map(c=>`${c} = ${CODES[c].l.toLowerCase()}`).join('; ')}.${cods.includes('F')?' Faltas justificadas lançadas como X não entram.':''}${semDados.size?` <b>Atenção: sem ponto lançado no sistema em ${[...semDados].join(', ')}; esses dias não foram considerados.</b>`:''}`});
}

const nfmt2=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});

function acordoInputs(a){

      <div class="ac-val"><span>R$</span><input type="text" inputmode="decimal" id="val_${k}" name="val_${k}" value="${on?nfmt2(v):''}" aria-label="Valor de ${l}"><span class="hint">${u}</span>
      <select id="pg_${k}" name="pg_${k}" aria-label="Forma de pagamento de ${l}" title="Forma de pagamento no fechamento">${Object.entries(PG).filter(([x])=>x!=='natal'||k==='tarifa').map(([x,n])=>`<option value="${x}" ${x===pg?'selected':''}>${n}</option>`).join('')}</select>
      ${k==='ajuda'?`<label class="ac-chk" style="font-weight:500"><input type="checkbox" id="fixa_ajuda" name="fixa_ajuda" ${a?.ajudaFixa?'checked':''}> Fixa: não desconta faltas</label>`:''}</div></div>`}).join('');
}
function lerAcordo(fm){
  const ben={},pg={};let tarifa=null;
  for(const [k,l] of VERBAS){
    if(!fm['chk_'+k].checked)continue;
    if(fm['pg_'+k]&&fm['pg_'+k].value!=='especie')pg[k]=fm['pg_'+k].value;
    const v=parseBRL(fm['val_'+k].value);
    if(!(v>0))return {erro:`Informe o valor de ${l} ou desmarque a verba.`};
    if(k==='tarifa')tarifa=v;else ben[k]=v;
  }
  const sal=fm.val_salario?parseBRL(fm.val_salario.value||''):NaN;
  const per=fm.val_peric?.value.trim()?parseBRL(fm.val_peric.value):0;
  if(!(per>=0&&per<=100))return {erro:'Informe a periculosidade em % (ex.: 30) ou deixe vazio.'};
  if(per>0&&!(sal>0))return {erro:'Informe o salário mensal: a periculosidade é calculada sobre ele.'};
  const ins=fm.val_insal?.value.trim()?parseBRL(fm.val_insal.value):0,insB=parseBRL(fm.val_insalBase?.value||'');
  if(!(ins>=0&&ins<=100))return {erro:'Informe a insalubridade em % (ex.: 20) ou deixe vazio.'};
  if(ins>0&&!(insB>0))return {erro:'Informe o salário mínimo usado na insalubridade.'};
  return {ben,tarifa,pg,cesta:!!fm.chk_cesta?.checked,salario:sal>0?sal:null,peric:per>0?per:null,insal:ins>0?ins:null,insalBase:ins>0?insB:null,ajudaFixa:ben.ajuda!=null&&!!fm.fixa_ajuda?.checked};
}

// Importação da folha: arquivo .json gerado a partir do PDF da contabilidade (nome, CPF, admissão, cargo, salário)
function prepImport(d){
  if(d?.tipo!=='sistemaDP.folha'||!Array.isArray(d.funcionarios))throw new Error('o arquivo não é uma lista de funcionários da folha');
  const lista=d.funcionarios.map(x=>{
    let f=ALL.find(y=>soDig(y.cpf)&&soDig(y.cpf)===soDig(x.cpf)),completar=null;
    // já cadastrado sem CPF: reconhece pelo nome e completa o CPF
    if(!f){f=ALL.find(y=>!soDig(y.cpf)&&norm(y.nome)===norm(x.nome));if(f)completar=f.id}
    // já cadastrado: completa o que falta (salário do mensalista, admissão); salário diferente só com a caixinha marcada
    const sal=f&&f.vinc==='mensalista'?acordo(f).salario:null;
    const faltaSal=!!f&&f.vinc==='mensalista'&&!sal&&x.salario>0,difSal=!!sal&&x.salario>0&&Math.abs(sal-x.salario)>.005;
    return {...x,existe:f?f.id:null,completar,faltaSal,difSal,salSist:sal,faltaAdm:!!f&&!f.adm&&!!x.adm,atualizar:false,semEmp:!FUNC[x.empresa],marcado:!f&&!!FUNC[x.empresa]}});
  return {comp:d.comp,lista};
}

const T_=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const H_=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function c999(n){if(n===100)return 'cem';const h=Math.floor(n/100),r=n%100,a=[];if(h)a.push(H_[h]);if(r>0&&r<20)a.push(U_[r]);else if(r>=20){const t=Math.floor(r/10),u=r%10;a.push(u?T_[t]+' e '+U_[u]:T_[t])}return a.join(' e ')}
function inteiro(n){if(n===0)return 'zero';const m=Math.floor(n/1000),r=n%1000;let s=m?(m===1?'mil':c999(m)+' mil'):'';if(r){s+=m?((r<100||r%100===0)?' e ':' '):'';s+=c999(r)}return s}
function extenso(v){const c=Math.round(v*100),re=Math.floor(c/100),ce=c%100,p=[];if(re||!ce)p.push(inteiro(re)+(re===1?' real':' reais'));if(ce)p.push(inteiro(ce)+(ce===1?' centavo':' centavos'));return p.join(' e ')}

function reciboHTML(f,tipo,rec){

  // data de assinatura: 1ª quinzena = último dia útil até o dia 15; 2ª quinzena e auxílio-transporte = último dia útil do mês; adiantamento = dia do registro
  const ultUtil=d=>{for(let x=d;x>=1;x--)if(obrig(x))return x;return d};
  const now=dd(tipo==='diarias'?ultUtil(QZ[rec.q].fim):tipo==='adiant'?calcAdiant(f).de:tipo==='cestaReg'?f.cestaReg.de:ultUtil(NDIAS))+'/'+ANO;
  let titulo,valor,texto,detalhe='',dias;
  if(tipo==='cesta'||tipo==='cestaReg'){
    valor=0;titulo='Recibo de cesta básica';const mesRef=tipo==='cestaReg'?MES_NOME:PROX_NOME+'/'+(MES===11?ANO+1:ANO);
    texto=`Declaro que recebi uma <b>cesta básica</b>, em substituição ao almoço, de acordo com a <b>Convenção Coletiva de Trabalho ${esc((EMPRESAS[emp]||{}).cct||'2025/2026')}</b>, referente ao mês de <b>${mesRef}</b>.`;
    dias=`Empresa: ${esc((EMPRESAS[emp]||{}).razao||emp)}`;
  } else if(tipo==='adiant'){
    const a=calcAdiant(f);valor=a.total;titulo='Recibo de auxílio-transporte';
    texto=`Recebi da empresa <b>${esc((EMPRESAS[emp]||{}).razao||emp)}</b> a importância de <b>${brl(valor)}</b> (${extenso(valor)}), referente ao auxílio-transporte do período <b>${dd(a.de)} a ${dd(NDIAS)}/${ANO}</b>.`;
    dias=`Dias úteis considerados: ${a.dias} (de ${dd(a.de)} a ${dd(NDIAS)}) · Obra: ${esc(OBRAS[lotacao(f,a.de)].nome)}`;
    if(S.recDetalhe)detalhe=a.itens.map(x=>`<tr><td>${x.nome} · ${x.f}</td><td>${brl(x.valor)}</td></tr>`).join('');
  } else if(tipo==='diarias'){
    const vq=valorQ(f,rec.q),ds=vq.ds;
    valor=vq.valor;titulo=`Recibo de pagamento - ${QZ[rec.q].nome}`;
    const obras=[...new Set(ds.map(d=>{const r=S.ponto[f.id][d];return OBRAS[resolve(r.o)]?.nome||r.o}))].join(', ');
    texto=`Recebi da empresa <b>${esc((EMPRESAS[emp]||{}).razao||emp)}</b> a importância de <b>${brl(valor)}</b> (${extenso(valor)}), referente a <b>${nfmt(vq.n)} diária(s)</b> de serviço prestado na função de ${esc(f.funcao)}, na <b>${QZ[rec.q].nome} de ${MES_NOME}</b> (${dd(QZ[rec.q].ini)} a ${dd(QZ[rec.q].fim)}/${ANO}).`;
    dias=`Dias de serviço: ${ds.map(d=>dd(d)).join(', ')||'—'} · Obra(s): ${esc(obras)||'—'}`;
    detalhe=`<tr><td>${nfmt(vq.n)} diária(s) × ${brl(f.diaria||DIARIAS[f.funcao])}</td><td>${brl(valor)}</td></tr>`;
  } else {
    const ks=Object.keys(BEN_NOMES).filter(k=>c.itens[k]);
    const fe=S.fechF[f.id],al=tipo==='alelo'||tipo==='natal'?fe.alelo:null,soma=ks.reduce((a,k)=>a+c.itens[k].valor,0),noCartao=fe?aleloSoma(fe.alelo):0;
    valor=tipo==='alelo'?soAlelo(al):tipo==='natal'?(+al.natal||0):soma-noCartao;titulo=tipo==='natal'?'Recibo de passagens NatalCard':'Recibo de auxílio-transporte';
    texto=`Recebi da empresa <b>${esc((EMPRESAS[emp]||{}).razao||emp)}</b> a importância de <b>${brl(valor)}</b> (${extenso(valor)})${tipo==='natal'?', creditada no cartão NatalCard':''}${tipo==='alelo'?`, creditada ${al.alim&&al.livre?'nos cartões Alelo':al.alim?'no cartão Alelo Alimentação':'no cartão Alelo Saldo Livre'}${S.recDetalhe&&al.alim&&al.livre?` (${['Alelo Alimentação '+brl(al.alim),'Alelo Saldo Livre '+brl(al.livre)].join('; ')})`:''}`:''}, referente ao auxílio-transporte do mês de <b>${PROX_NOME}/${MES===11?ANO+1:ANO}</b>.`;
    const dt=c.rateio.reduce((a,b)=>a+b.dias,0)-(temAvulso(f)?Object.entries(S.ponto[f.id]).filter(([d,r])=>CODES[r.c].trab&&vincDia(f,+d)==='avulso').length:0);
    dias=`Dias considerados em ${MES_NOME}: ${nfmt(dt)} · Obra(s): ${c.rateio.map(x=>esc(x.obra)).join(', ')||'—'}`;
    if(tipo==='natal')detalhe='';
    else if(tipo==='alelo')detalhe=!S.recDetalhe?'':(al.alim?`<tr><td>Alelo Alimentação</td><td>${brl(al.alim)}</td></tr>`:'')+(al.livre?`<tr><td>Alelo Saldo Livre</td><td>${brl(al.livre)}</td></tr>`:'');
    else if(S.recDetalhe)detalhe=ks.filter(k=>c.itens[k].valor!==0).map(k=>`<tr><td>${BEN_NOMES[k]}${c.itens[k].ref?' · '+c.itens[k].ref:''}</td><td>${brl(c.itens[k].valor)}</td></tr>`).join('')+(noCartao?`<tr><td>(−) Creditado nos cartões (Alelo/NatalCard)</td><td>−${brl(noCartao)}</td></tr>`:'');
  }
  const E=EMPRESAS[emp]||{};
  return `<article class="recibo" data-f="${f.id}"><header>${E.logo?`<img class="logo-img" src="${E.logo}" alt="Logomarca ${esc(emp)}">`:`<div class="logo">${emp.slice(0,2)}</div>`}<div><b>${esc(E.razao||emp)}</b><br><span class="hint">${E.cnpj?'CNPJ '+esc(E.cnpj):'<span style="color:var(--bad)">CNPJ não cadastrado (aba Empresas)</span>'}${E.end?' · '+esc(E.end):''}${E.cidade?' · '+esc(E.cidade):''}</span></div>
      <div class="rec-num">${tipo==='cesta'||tipo==='cestaReg'?'<span class="hint">Benefício</span><b>CESTA BÁSICA</b>':`<span class="hint">Valor</span><b class="num">${brl(valor)}</b>`}</div></header>
    <h3>${titulo}</h3>
    <p>${texto}</p>
    ${detalhe?`<table class="rec-tab">${detalhe}<tr><td><b>Total</b></td><td><b>${brl(valor)}</b></td></tr></table>`:''}
    <dl class="rec-dados"><div><dt>Funcionário</dt><dd>${esc(f.nome)}</dd></div><div><dt>CPF</dt><dd class="num">${cpfTxt(f)}</dd></div><div><dt>Função</dt><dd>${esc(f.funcao)}</dd></div><div><dt>Competência</dt><dd>${tipo==='aux'||tipo==='alelo'||tipo==='natal'||tipo==='cesta'?PROX_NOME+'/'+(MES===11?ANO+1:ANO):MES_NOME}</dd></div></dl>
    <p class="hint">${dias}</p>
    <div class="assin"><span>${esc(OBRAS[lotacao(f,NDIAS)]?.cidade||'')}, ${now}</span><span class="linha">${esc(f.nome)}</span></div>
    <footer class="hint">Emitido em ${now} · versão ${rec.versao} · Sistema DP</footer></article>`;
}
// ---------- Diárias de avulsos por quinzena ----------
const QZ={1:{ini:1,fim:15,nome:'1ª quinzena'},2:{ini:16,fim:NDIAS,nome:'2ª quinzena'}};
const qDe=d=>d<=15?1:2;
function valorQ(f,q){
  const r=QZ[q],p=S.ponto[f.id];
  const ds=Object.keys(p).map(Number).filter(d=>d>=r.ini&&d<=r.fim&&CODES[p[d].c].trab&&vincDia(f,d)==='avulso').sort((a,b)=>a-b);
  const n=ds.reduce((a,d)=>a+CODES[p[d].c].peso,0),nv=ds.filter(d=>!resolve(p[d].o)).length;
  return {ds,n,nv,valor:n*(f.diaria||DIARIAS[f.funcao])};
}
function modalRecibos(titulo,sub,out,refresh){
  $('#modal').innerHTML=`<div class="overlay" id="ov"><div class="editor recibos">
    <div class="rec-top"><div><h2>${titulo}</h2><span class="hint">${sub}</span></div>
    ${refresh?`<label class="ac-chk" style="font-weight:500"><input type="checkbox" id="recDet" ${S.recDetalhe?'checked':''}> Mostrar o detalhamento</label>`:''}
    ${btnImprimir()}<button class="btn" id="recFechar">Fechar</button></div>${out||'<p class="hint">Nenhum valor a pagar.</p>'}</div></div>`;
  $('#recFechar').onclick=()=>{$('#modal').innerHTML=''};
  $('#ov').onclick=e=>{if(e.target.id==='ov')$('#modal').innerHTML=''};
  if(refresh)$('#recDet').onchange=e=>{S.recDetalhe=e.target.checked;refresh()};
}
function recibosFicha(f){
  const dp=S.perfil==='dp',st=stDe(f),pode=dp&&st!=='fechado'&&st!=='aguardando',p=S.ponto[f.id],c=calc(f);
  let tAv=0,tMen=0,nF=0,nAT=0,nX=0,nSU=0,nPE=0,nFE=0;
  for(const d in p){const x=p[d];if(CODES[x.c].trab){if(vincDia(f,+d)==='avulso')tAv+=CODES[x.c].peso;else tMen+=CODES[x.c].peso}else if(x.c==='F')nF++;else if(x.c==='AT')nAT++;else if(x.c==='SU')nSU++;else if(x.c==='PE')nPE++;else if(x.c==='FE')nFE++;else nX++}
  const pend=atrasados(pendF(f)).length,nv=nvF(f);
  const card=(t,v,cls='')=>`<div class="ac-card ${cls}"><span class="hint">${t}</span><b class="num">${v}</b></div>`;
  let h=`<div class="ficha-top" style="margin-top:14px"><h3 class="sub" style="margin:0">Ponto de ${MES_NOME}</h3><button class="btn" data-govcal="${f.id}">Abrir calendário</button></div><div class="ac-cards">
    ${temAvulso(f)?card('Dias como avulso',nfmt(tAv)):''}${f.vh.some(x=>x.vinc==='mensalista')?card('Dias como mensalista',nfmt(tMen)):''}
    ${card('Faltas (F)',nF,nF?'':'off')}${card('Atestados (AT)',nAT,nAT?'':'off')}${nSU?card('Suspensões (SU)',nSU):''}${nPE?card('Perícias (PE)',nPE):''}${nFE?card('Férias (FE)',nFE):''}${card('Dias X',nX,'off')}${card('Dias sem lançamento',pend,pend?'':'off')}</div>`;
  if(dp)h+=agendaHTML(f);
  const blocos=[];let total=0,nSel=0;
  // caixinha para juntar este recibo numa impressão só (só para recibos já emitidos)
  const sel=tipo=>dp?(nSel++,`<label class="ac-chk rsel-lbl"><input type="checkbox" class="rsel" data-f="${f.id}" value="${tipo}"> Imprimir</label>`):'';
  const bloco=(titulo,ok,valor,linhas,botao,obs)=>{total+=valor;blocos.push(`<div class="pay ${ok?'pay-ok':''}"><div class="pay-head"><span class="ic ${ok?'ok':'warn'}">${ok?'✓':'…'}</span><b>${titulo}</b><b class="num" style="margin-left:auto">${brl(valor)}</b></div>
    ${linhas.length?`<table class="rec-tab" style="width:100%">${linhas.map(l=>`<tr><td>${l[0]}<br><span class="hint">${l[1]}</span></td><td>${brl(l[2])}</td></tr>`).join('')}</table>`:''}
    <div class="pay-foot"><span class="hint">${obs}</span>${botao||''}</div></div>`)};
  if(temAvulso(f))for(const q of [1,2]){const v=valorQ(f,q),x=S.qf[q][f.id];if(!x&&!v.n)continue;const u=x||v;
    bloco(`Recibo de pagamento - ${QZ[q].nome} · ${MES_NOME}`,!!x,u.valor,[[`${nfmt(u.n)} diária(s) × ${brl(f.diaria||DIARIAS[f.funcao])}`,'dias: '+u.ds.map(dd).join(', '),u.valor]],
      x?`${sel('q'+q)}<button class="btn" data-qrec="${q}:${f.id}">Ver recibo</button>`:(pode&&!v.nv?`<button class="btn primary" data-qfechone="${q}:${f.id}">Fechar quinzena e emitir</button>`:''),
      x?`fechada em ${x.quando}`:`aberta · fecha em ${dd(QZ[q].fim)}${v.nv?' · vincular nome de obra':''}`)}
  const a=calcAdiant(f);
  if(a&&a.total>0&&f.adiantQuando&&f.vinc==='mensalista')bloco(`Adiantamento auxílio-transporte · ${MES_NOME}`,true,a.total,a.itens.map(x=>[x.nome+' · '+MES_CURTO,x.f,x.valor]),`${sel('adiant')}<button class="btn" data-veradiant="${f.id}">Ver recibo</button>`,`no registro · ${dd(a.de)} a ${dd(NDIAS)} · emitido em ${f.adiantQuando}`);
  const ks=Object.keys(BEN_NOMES).filter(k=>c.itens[k]);
  if(ks.length){const fe=S.fechF[f.id],v=fe&&fe.aux!=null?fe.aux:ks.reduce((s2,k)=>s2+c.itens[k].valor,0);
    const al=fe?fe.alelo:aleloPadrao(f,v),podeFechar=!fe&&pode&&!pend&&!nv;
    const divisao=fe?(aleloSoma(al)?`<div class="alelo-res"><span>Espécie <b>${brl(v-aleloSoma(al))}</b></span><span>Alelo Alimentação <b>${brl(al.alim)}</b></span><span>Alelo Saldo Livre <b>${brl(al.livre)}</b></span>${al.natal?`<span>NatalCard <b>${brl(al.natal)}</b></span>`:''}</div>`:'')
      :(podeFechar?`<div class="alelo-form"><b>Cartões (Alelo e NatalCard)</b> <span class="hint">(sugerido pelo acordo; pode ajustar. O restante sai em espécie)</span>
        <div class="alelo-campos"><label>Alelo Alimentação R$ <input type="text" inputmode="decimal" id="aleloAlim-${f.id}" data-alelo="${f.id}" value="${al.alim?nfmt2(al.alim):''}" placeholder="0,00"></label>
        <label>Alelo Saldo Livre R$ <input type="text" inputmode="decimal" id="aleloLivre-${f.id}" data-alelo="${f.id}" value="${al.livre?nfmt2(al.livre):''}" placeholder="0,00"></label>
        <label>NatalCard R$ <input type="text" inputmode="decimal" id="aleloNatal-${f.id}" data-alelo="${f.id}" value="${al.natal?nfmt2(al.natal):''}" placeholder="0,00"></label>
        <span>Em espécie: <b id="aleloEsp-${f.id}" data-total="${v}">${brl(v-aleloSoma(al))}</b></span></div></div>`:'')+
      (podeFechar&&acordo(f).cesta?`<label class="ac-chk cesta-box"><input type="checkbox" id="cesta-${f.id}" checked> Emitir recibo da cesta básica (${PROX_NOME}/${MES===11?ANO+1:ANO})</label>`:'');
    bloco(`Recibo de auxílio-transporte · ${PROX_NOME}/${MES===11?ANO+1:ANO}`,!!fe,v,ks.map(k=>[BEN_NOMES[k]+' · '+(c.itens[k].ref||''),c.itens[k].f,c.itens[k].valor]),
      divisao+(fe?`${sel('aux,cartoes')}<button class="btn" data-recibos="${f.id}">Ver recibo${aleloSoma(al)?'s':''}</button>`:(podeFechar?`<button class="btn primary" data-fechone="${f.id}">Fechar e emitir</button>`:'')),
      fe?`fechado em ${fe.quando}`:(pend||nv?`resolva antes: ${pend?pend+' dia(s) sem lançamento':''}${pend&&nv?' e ':''}${nv?nv+' nome(s) de obra a vincular':''}`:`aberto · fecha em ${dd(NDIAS)}`))}
  {const de=diaEntrada(f),reg=de&&{de};
   if(reg&&!f.adiantQuando&&f.vinc==='mensalista'&&a&&a.total>0)blocos.push(`<div class="pay"><div class="pay-head"><span class="ic warn">…</span><b>Adiantamento auxílio-transporte · ${MES_NOME} (entrada)</b><span class="num" style="margin-left:auto">${brl(a.total)}</span></div><div class="pay-foot"><span class="hint">entrou em ${dd(de)}/${ANO}; ${a.lista} de ${dd(de)} a ${dd(NDIAS)} ainda não foram entregues</span>${S.perfil==='dp'?`<button class="btn primary" data-geraradiant="${f.id}">Emitir recibo de entrada</button>`:''}</div></div>`);
   if(reg&&!temCestaReg(f)&&f.vinc==='mensalista')blocos.push(`<div class="pay"><div class="pay-head"><span class="ic warn">…</span><b>Recibo de cesta básica · ${MES_NOME} (registro)</b></div><div class="pay-foot"><span class="hint">${acordo(f).cesta?`registrado em ${dd(reg.de)}/${ANO}; o recibo da cesta do mês do registro ainda não foi emitido`:'o acordo não tem cesta básica marcada (use "Alterar acordo" para marcar)'}</span>${acordo(f).cesta&&S.perfil==='dp'?`<button class="btn primary" data-gerarcestareg="${f.id}">Emitir recibo da cesta do registro</button>`:''}</div></div>`)}
  if(temCestaReg(f))blocos.push(`<div class="pay pay-ok"><div class="pay-head"><span class="ic ok">✓</span><b>Recibo de cesta básica · ${MES_NOME} (registro)</b></div><div class="pay-foot"><span class="hint">emitido no registro em ${dd(f.cestaReg.de)}/${ANO}</span>${sel('cestaReg')}<button class="btn" data-vercestareg="${f.id}">Ver recibo</button></div></div>`);
  if(acordo(f).cesta&&f.vinc==='mensalista'){const fe=S.fechF[f.id];
    blocos.push(`<div class="pay ${fe?.cesta?'pay-ok':''}"><div class="pay-head"><span class="ic ${fe?.cesta?'ok':'warn'}">${fe?.cesta?'✓':(fe?'—':'…')}</span><b>Recibo de cesta básica · ${PROX_NOME}/${MES===11?ANO+1:ANO}</b></div>
      <div class="pay-foot"><span class="hint">${fe?(fe.cesta?'emitido no fechamento de '+fe.quando:'não emitido neste mês (decisão do DP no fechamento)'):ks.length?'sai junto com o fechamento da 2ª quinzena':pend||nv?`resolva antes: ${pend?pend+' dia(s) sem lançamento':''}${pend&&nv?' e ':''}${nv?nv+' nome(s) de obra a vincular':''}`:'só a cesta neste acordo: feche o mês do funcionário para emitir'}</span>${fe?.cesta?`${sel('cesta')}<button class="btn" data-vercesta="${f.id}">Ver recibo</button>`:''}${!fe&&!ks.length&&pode&&!pend&&!nv?`<button class="btn primary" data-fechone="${f.id}">Fechar e emitir</button>`:''}</div></div>`)}
  if(!blocos.length)return h;
  const acoes=nSel>1?`<span style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" data-rseltodos="1">Selecionar todos</button><button class="btn primary" data-rselimp="${f.id}">Imprimir selecionados</button></span>`:'';

}
function fecharQ(q,ids){
  const now=new Date(),qd=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  ids.forEach(id=>{const f=byId(id),v=valorQ(f,q),k=q+':'+id;S.qver[k]=(S.qver[k]||0)+1;S.qf[q][id]={...v,quando:qd,versao:S.qver[k]};registrar(`Diárias · ${QZ[q].nome} · ${f.nome}`,'Aberta',`Fechada · ${nfmt(v.n)} diária(s) · ${brl(v.valor)}`,'Fechamento da quinzena')});
  render();emitirQ(q,ids);
}
function emitirQ(q,ids){  const out=ids.map(id=>{const f=byId(id),x=S.qf[q][id];return reciboHTML(f,'diarias',{q,quando:x.quando,versao:x.versao})}).join('');
  modalRecibos(`Recibo de pagamento - ${QZ[q].nome} · ${MES_NOME}`,`${ids.length} recibo(s) de diárias de serviço avulso (${dd(QZ[q].ini)} a ${dd(QZ[q].fim)}). No sistema, saem em PDF.`,out);
}
// Recibos de entrada do mês (adiantamento auxílio-transporte e cesta do mês de entrada), com seleção para imprimir vários de uma vez
function entradaHTML(dp){
  const fs=visiveis().filter(f=>f.vinc==='mensalista'&&diaEntrada(f)&&((calcAdiant(f)?.total||0)>0||acordo(f).cesta));
  if(!fs.length)return `<div style="padding:0 14px 16px"><h3 class="sub">Recibos de entrada · adiantamento auxílio-transporte</h3>
    <p class="hint" style="margin:0">Ninguém entrou como mensalista em ${MES_NOME} com auxílio ou cesta no acordo. Aparecem aqui os admitidos como mensalista neste mês (pela data de admissão) e os avulsos registrados neste mês.</p></div>`;
  let h=`<div style="padding:0 14px 16px"><h3 class="sub">Recibos de entrada · adiantamento auxílio-transporte</h3>
    <p class="hint" style="margin:0 0 8px">Quem entrou como mensalista neste mês recebe na entrada o auxílio-transporte dos dias úteis restantes e a cesta básica do mês. Marque os funcionários e imprima os recibos de uma vez.</p>
    <div class="scroller"><table class="ben"><thead><tr>${dp?'<th></th>':''}<th style="text-align:left">Funcionário</th><th>Entrada</th><th style="text-align:left">Itens</th><th>Adiantamento</th><th style="text-align:left">Cesta</th><th style="text-align:left">Situação</th></tr></thead><tbody>`;
  for(const f of fs){
    const a=calcAdiant(f),de=diaEntrada(f),temCe=!!acordo(f).cesta,emit=!!f.adiantQuando||!(a?.total>0);
    h+=`<tr>${dp?`<td><input type="checkbox" class="entchk" value="${f.id}" aria-label="Selecionar ${esc(f.nome)}"></td>`:''}
      <td style="text-align:left;font-family:var(--f-body)"><b>${esc(f.nome)}</b><br><span class="hint">${esc(f.funcao)} · ${empresaDe(f)}</span></td>
      <td>${dd(de)}/${ANO}</td><td style="text-align:left;white-space:normal;font-family:var(--f-body)">${a?.total>0?esc(a.lista)+` · ${a.dias} dia(s) útil(eis)`:'—'}</td>
      <td>${a?.total>0?brl(a.total):'—'}</td><td style="text-align:left;font-family:var(--f-body)">${temCe?(temCestaReg(f)?'Emitida':'A emitir'):'—'}</td>

  const de=diaEntrada(f);if(!de)return null;

  const it=[];
  const add=(k,nome,bruto,form)=>{if(bruto!=null)it.push({k,nome,valor:k==='transp'?Math.floor(bruto+1e-9):floor10(bruto),f:`${form} = ${brl(bruto)}`})};
  if(A.ben.ajuda!=null)add('ajuda','Ajuda de custo',A.ben.ajuda/DU_AGO*dias,`${brl(A.ben.ajuda)} ÷ ${DU_AGO} dias úteis × ${dias} dias`);
  if(A.ben.cafe!=null)add('cafe','Auxílio café',A.ben.cafe/DU_AGO*dias,`${brl(A.ben.cafe)} ÷ ${DU_AGO} dias úteis × ${dias} dias`);

  return {de,dias,itens:it,por,total:it.reduce((a,x)=>a+x.valor,0),lista:it.map(x=>x.nome.toLowerCase()).join(', ').replace(/, ([^,]*)$/,' e $1')};

function lerAlelo(f,total){
  const ia=$('#aleloAlim-'+f.id),il=$('#aleloLivre-'+f.id),inat=$('#aleloNatal-'+f.id);
  if(!ia)return {ok:true,alelo:aleloPadrao(f,total)};

  if(a.alim<0||a.livre<0||a.natal<0)return {erro:'Valores dos cartões não podem ser negativos.'};

  if(st==='conferencia')return `<button class="btn primary" data-go="aguardando" ${bloq?'disabled':''}>Concluir conferência</button><button class="btn" data-go="aberto">Voltar para aberto</button>${bloq?'<span class="hint">Resolva os itens em vermelho para concluir.</span>':''}`;
  if(st==='aguardando')return `<button class="btn primary" data-go="fechado">Aprovar e fechar</button><button class="btn" data-go="conferencia">Devolver para conferência</button>`;
  return `<input type="text" id="justReab" placeholder="Motivo da reabertura" style="flex:1 1 200px"><button class="btn" data-go="aberto" data-reab="1">Reabrir competência</button>`;
}

let ED=null;
function abrirEditor(fid,d){
  const f=byId(fid),r=S.ponto[fid][d];
  ED={f,d,prev:r?{...r}:null,c:r?r.c:null,o:r?r.o:'',obs:r?.obs||'',meio:r?.c==='M'};
  drawEditor();
}
function precisaJust(){
  if(!ED.prev)return stDe(ED.f)==='conferencia';
  return true;
}
function drawEditor(err){
  const {f,d}=ED,trab=ED.c&&CODES[ED.c].trab,sug=OBRAS[lotacao(f,d)].nome;
  const textos=[...new Set(Object.values(S.ponto).flatMap(p=>Object.values(p).map(x=>x.o).filter(Boolean)))];
  $('#modal').innerHTML=`<div class="overlay" id="ov"><form class="editor" id="edForm" aria-label="Lançar dia">
   <div><h2>${esc(f.nome)}</h2><span class="hint">${WD_LONG[dow(d)]}, ${dd(d)}/${ANO} · ${obrig(d)?'dia obrigatório':'fim de semana'}${ED.prev?' · lançado: '+CODES[ED.prev.c].l:' · Não informado'}</span></div>
   <div class="codes">${['P','F','AT','SU','PE','FE','X'].map(k=>`<button type="button" class="c-${k}" data-code="${k}" aria-pressed="${k==='P'?!!trab:ED.c===k}"><b>${k==='P'?'Obra':k}</b>${k==='P'?'Trabalhou':CODES[k].l}</button>`).join('')}
     <button type="button" class="none" data-code="" aria-pressed="${!ED.c}"><b>—</b>Não informado</button></div>
   ${trab?`<div class="field"><label for="edObra">Obra do dia (digitação livre)</label><input type="text" id="edObra" list="dlObras" value="${esc(ED.o)}" autocomplete="off">
     <datalist id="dlObras">${textos.map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
     <div class="obra-pick"><span class="hint">Obras cadastradas (clique para escolher):</span>${Object.entries(OBRAS).filter(([,o])=>o.status!=='Concluída').map(([oid,o])=>`<button type="button" class="pick ${empCls(oid)} ${norm(o.nome)===norm(ED.o)?'on':''}" data-obrapick="${esc(o.nome)}">${esc(o.nome)}</button>`).join('')}</div>
     <label class="ac-chk" style="font-weight:500"><input type="checkbox" id="edMeio" ${ED.c==='M'?'checked':''}> Meio dia (vale 0,5)</label>
     <span class="sugg">Obra principal: ${sug}.${ED.o&&!resolve(ED.o)?' Nome novo: o DP vai vincular a uma obra cadastrada antes do fechamento.':''}</span></div>`:''}
   <div class="field"><label for="edObs">Observação do dia</label><input type="text" id="edObs" value="${esc(ED.obs)}" placeholder="${ED.c==='X'?'Motivo: férias, folga, exame ASO, obra paralisada, falta justificada…':''}"></div>
   ${precisaJust()?`<div class="field"><label for="edJust">Motivo da ${ED.prev?'correção':'alteração'} (obrigatório)</label><input type="text" id="edJust" placeholder="Ex.: mestre informou que trabalhou em outra obra"></div>`:''}
   ${err?`<div class="err">${err}</div>`:''}
   ${(()=>{const hs=S.audit.filter(a=>a.onde===`${f.nome} · ${dd(d)}`);
     return hs.length?`<div><h3 class="sub" style="font-size:16px;margin:4px 0">Histórico deste dia</h3><ul style="margin:0;padding-left:18px;font-size:13px">${hs.slice().reverse().map(a=>`<li><span class="hint">${a.quando} · ${esc(a.quem)}</span><br>${esc(a.antes)} → <b>${esc(a.depois)}</b>${a.just?`<br><span class="hint">Motivo: ${esc(a.just)}</span>`:''}</li>`).join('')}</ul></div>`:''})()}
   <div class="actions"><button class="btn primary" type="submit">Salvar</button><button class="btn" type="button" id="edCancel">Cancelar</button></div>
  </form></div>`;
  $('#edForm').querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>{
    keepFields();ED.c=b.dataset.code||null;if(ED.c==='P'&&ED.meio)ED.c='M';
    if(ED.c&&CODES[ED.c].trab&&!ED.o)ED.o=sug;
    if(ED.c&&!CODES[ED.c].trab)ED.o='';
    drawEditor();
  });
  $('#edForm').querySelectorAll('[data-obrapick]').forEach(b=>b.onclick=()=>{keepFields();ED.o=b.dataset.obrapick;drawEditor();$('#edJust')?.focus()});
  $('#edCancel').onclick=fecharEditor;
  $('#ov').onmousedown=e=>{ED.downFora=e.target.id==='ov'};$('#ov').onclick=e=>{if(e.target.id==='ov'&&ED&&ED.downFora)fecharEditor()};
  $('#edForm').onsubmit=e=>{e.preventDefault();salvar()};

function keepFields(){ if($('#edMeio')){ED.meio=$('#edMeio').checked;ED.c=ED.meio?'M':'P'} if($('#edObra'))ED.o=$('#edObra').value; if($('#edObs'))ED.obs=$('#edObs').value; ED.just=$('#edJust')?.value }
function fecharEditor(){ $('#modal').innerHTML='';ED=null }
function salvar(){
  keepFields();
  const {f,d,prev}=ED,trab=ED.c&&CODES[ED.c].trab;
  if(d<admDia(f)&&ED.c)return drawEditor(`Antes do ${nomeInicio(f)} (${f.adm}) não pode haver lançamento. Escolha "Não informado" para apagar.`);
  if(trab&&!ED.o.trim())return drawEditor('Informe a obra: ela é obrigatória nos dias trabalhados.');
  const novo=ED.c?{c:ED.c,o:trab?ED.o.trim():'',obs:ED.obs.trim()}:null;
  const desc=x=>x?CODES[x.c].l+(x.o?' · '+x.o:''):'Não informado';
  if(desc(prev)===desc(novo)&&(prev?.obs||'')===(novo?.obs||''))return fecharEditor();
  if(precisaJust()&&(!ED.just||ED.just.trim().length<4))return drawEditor('Escreva o motivo da correção (pelo menos 4 letras).');
  if(novo){if(!novo.obs)delete novo.obs;S.ponto[f.id][d]=novo}else delete S.ponto[f.id][d];
  const now=new Date();
  S.audit.push({quando:now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),
    quem:S.perfil==='dp'?'DP (usuário de exemplo)':'Gestor · Residencial Ipê',onde:`${f.nome} · ${dd(d)}`,antes:desc(prev),depois:desc(novo),just:ED.just?.trim()||''});
  fecharEditor();render();toast(noLimite(f)&&novo&&CODES[novo.c].trab&&vincDia(f,d)==='avulso'?`Dia salvo. Atenção: ${f.nome} já tem ${nfmt(diasTeste(f))} dia(s) de período de teste (limite ${LIMITE_TESTE}). Registre como mensalista.`:'Dia salvo. Planilha e calendário atualizados.');
}

function nuvemAgendar(){
  if(!NV.pronto||NV.aplicando||NV.bloq||nvDados()===NV.ultimo)return;
  NV.pendente=true;nvSt('Salvando…','sv');
  clearTimeout(NV.timer);NV.timer=setTimeout(nvEnviar,700);
}
async function nvEnviar(){
  if(NV.salvando){clearTimeout(NV.timer);NV.timer=setTimeout(nvEnviar,500);return}
  const d=nvDados();
  if(d===NV.ultimo){NV.pendente=false;nvSt('✓ Salvo','ok');return}
  NV.salvando=true;
  try{
    const {data,error}=await NV.cli.rpc('salvar_estado',{p_id:NUVEM.id,p_dados:d,p_versao_base:NV.versao});
    if(error)throw error;
    if(data<0){
      // outra pessoa salvou antes: vale a versão dela
      NV.salvando=false;NV.pendente=false;await nvPuxar();
      toast('Outra pessoa salvou alterações ao mesmo tempo. A tela foi atualizada com os dados dela: confira e refaça a sua última alteração.');return}
    NV.versao=data;NV.ultimo=d;
    if(nvDados()===d){NV.pendente=false;nvSt('✓ Salvo','ok')}
  }catch(e){console.error(e);nvSt('⚠ Sem conexão · tentando de novo','bad');clearTimeout(NV.timer);NV.timer=setTimeout(nvEnviar,8000)}
  finally{NV.salvando=false}
}
async function nvPuxar(){
  const {data,error}=await NV.cli.from('estado').select('versao,dados,atualizado_por').eq('id',NUVEM.id).maybeSingle();
  if(error)throw error;
  if(data&&data.versao>NV.versao)nvAplicar(data);
  return data;
}
function nvAplicar(row){
  NV.versao=row.versao;NV.depois=false;NV.bloq=false;
  try{localStorage.setItem(LS,row.dados)}catch(e){}
  // cada pessoa continua na empresa que estava vendo
  const emp=S.empresa;NV.aplicando=true;
  try{carregarLocal();if(emp){S.empresa=emp;$('#selEmp').value=emp}render()}finally{NV.aplicando=false}
  NV.ultimo=nvDados();NV.pendente=false;nvSt('✓ Salvo','ok');
}
async function nvChegou(){
  // com alteração minha ainda não enviada, o envio resolve o conflito
  if(NV.salvando||NV.pendente)return;
  if(nvModalAberto()){NV.depois=true;nvSt('↻ Alteração de outra pessoa · atualiza ao fechar a janela','sv');return}
  try{const r=await nvPuxar();if(r&&r.atualizado_por&&r.atualizado_por!==NV.email)toast('Dados atualizados por '+nomeDe(r.atualizado_por)+'.')}catch(e){console.error(e)}
}
function nvOuvir(){

  NV.cli.channel('estado-'+NUVEM.id).on('postgres_changes',{event:'*',schema:'public',table:'estado'},p=>{
    const n=p.new||{};if(n.id&&n.id!==NUVEM.id)return;if(!n.versao||n.versao>NV.versao)nvChegou()}).subscribe((s,err)=>{NV.rt=s;if(err)console.error('tempo real:',err)});

    if(error)throw error;
    let rest=false;try{rest=localStorage.getItem(LS+'.restaurar')==='1'}catch(e){}
    const local=nvDados();
    if(row&&!rest){
      // primeira vez neste computador: guarda os dados locais antes de trocá-los pelos da nuvem
      try{if(local&&local!==row.dados&&!localStorage.getItem(LS+'.nuvem'))localStorage.setItem(LS+'.antes-da-nuvem',local)}catch(e){}
      nvAplicar(row);
    }else{
      NV.versao=row?row.versao:0;NV.ultimo='';
      // a nuvem ainda está vazia: só envia os dados deste computador se a pessoa confirmar
      if(!row&&S.persist&&!rest&&!confirm(`A nuvem ainda não tem dados.\n\nEnviar os dados deste computador (${ALL.length} funcionário(s), competência ${MES_NOME})?\n\nIsso deve ser feito só uma vez, no computador com os dados certos.`))NV.bloq=true;
